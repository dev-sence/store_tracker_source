# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.4
yarn_mappings=1.21.4+build.8
loader_version=0.19.5
# fabric.mod.json에 "이 버전 이상이면 실행 가능"으로 박히는 값 - loader_version(빌드용, 항상 최신)과
# 분리해둔다. 코드가 쓰는 FabricLoader API(getConfigDir/getGameDir/getModContainer/getRawGameVersion)가
# 전부 오래전부터 있던 것들이라 굳이 최신 로더를 강제할 필요가 없고, 실제로 Feather 같은 런처가
# 번들하는 구버전 로더(0.19.3 등)에서도 막힘없이 돌아가야 해서 넉넉하게 낮춰 잡는다.
loader_version_min=0.15.6
# Mod Properties
mod_version=1.0.16
maven_group=sence.playf
archives_base_name=Sence_StoreTracker
# Dependencies
# check this on https://fabricmc.net/develop
fabric_version=0.119.4+1.21.4
