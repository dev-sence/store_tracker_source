{% extends "base.html" %}
{% block title %}로그인 - Sence StoreTracker{% endblock %}
{% block body %}
<div class="d-flex align-items-center justify-content-center" style="min-height:100vh;">
  <div class="panel p-4 p-md-5 login-card">
    <div class="text-center mb-4">
      <div class="mb-2" style="font-size:2.2rem;">📦</div>
      <h4 class="fw-bold mb-1">Sence StoreTracker</h4>
      <div class="text-secondary small">관리자 토큰으로 로그인하세요</div>
    </div>
    <form method="post" action="{{ url_for('dashboard.login_submit') }}">
      <div class="mb-3">
        <label class="form-label small text-secondary">Admin Token</label>
        <input type="password" name="token" class="form-control form-control-lg" placeholder="••••••••••••" autofocus required>
      </div>
      <button type="submit" class="btn btn-accent btn-lg w-100">
        <i class="bi bi-box-arrow-in-right me-1"></i> 로그인
      </button>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}
