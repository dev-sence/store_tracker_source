<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sence StoreTracker{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  <link href="{{ url_for('static', filename='css/dashboard.css') }}" rel="stylesheet">
  <script>
    // 화면이 그려지기 전에 저장된 테마를 먼저 적용해서 깜빡임(다크->라이트 전환)을 막는다.
    (function () {
      try {
        var saved = localStorage.getItem('sence_theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) { /* localStorage 막혀 있으면 기본(dark)으로 */ }
    })();
  </script>
</head>
<body {% block body_attrs %}{% endblock %}>
{% block theme_toggle %}
<div style="position: fixed; top: 14px; right: 14px; z-index: 1050;">
  <button type="button" class="theme-btn" id="themeToggleBtn" title="테마 전환">
    <span class="theme-icon" id="themeToggleIcon">🌙</span>
    <span class="theme-text" id="themeToggleText">다크 모드</span>
  </button>
</div>
{% endblock %}
{% block body %}{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
